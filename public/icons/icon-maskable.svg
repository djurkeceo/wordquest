    <!-- white cheeks -->
    <path d="M100 290 Q130 300 176 316 Q226 332 256 372 Q286 332 336 316 Q382 300 412 290 Q400 330 372 360 Q320 424 256 428 Q192 424 140 360 Q112 330 100 290 Z" fill="#FFF6EC"/>
    <!-- eyes -->
    <ellipse cx="190" cy="274" rx="19" ry="25" fill="#2A1408"/>
    <ellipse cx="322" cy="274" rx="19" ry="25" fill="#2A1408"/>
    <circle cx="197" cy="265" r="7" fill="#fff"/>
    <circle cx="329" cy="265" r="7" fill="#fff"/>
