    <!-- cheek blush -->
    <circle cx="150" cy="322" r="16" fill="#FF8FA3" opacity="0.55"/>
    <circle cx="362" cy="322" r="16" fill="#FF8FA3" opacity="0.55"/>
  </g>
  <!-- sparkle -->
  <path d="M256 58 L265 86 L293 95 L265 104 L256 132 L247 104 L219 95 L247 86 Z" fill="#FFC83D"/>
  <!-- mini word card -->
  <g transform="rotate(-8 112 420)">
    <rect x="62" y="372" width="96" height="96" rx="22" fill="#FFFFFF"/>
    <polyline points="82,398 97,442 112,412 127,442 142,398" fill="none" stroke="#6C4BF6" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
