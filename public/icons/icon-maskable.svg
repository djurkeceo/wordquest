  </defs>
  <rect width="512" height="512" rx="0" fill="url(#bg)"/>
  <!-- soft glow -->
  <circle cx="256" cy="268" r="170" fill="#FFFFFF" opacity="0.12"/>
  <!-- fox head -->
  <g>
    <!-- ears -->
    <path d="M104 96 L204 176 L112 262 Q84 190 104 96 Z" fill="url(#fox)"/>
    <path d="M408 96 L308 176 L400 262 Q428 190 408 96 Z" fill="url(#fox)"/>
    <path d="M128 142 L180 184 L130 232 Q116 186 128 142 Z" fill="#4A2310"/>
    <path d="M384 142 L332 184 L382 232 Q396 186 384 142 Z" fill="#4A2310"/>
